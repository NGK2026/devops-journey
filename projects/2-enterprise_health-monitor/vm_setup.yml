---
## ALL
# PKG UPDATES
- hosts: all
  become: true
  pre_tasks: 

  - name: update cache (centos)
    tags: always
    dnf:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "CentOS"

  - name: update cache (ubuntu)
    tags: always
    apt:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: update cache (archlinux)
    tags: always
    pacman:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Archlinux"

# VOID USER
- hosts: all
  become: true
  tasks:

  - name: create void user
    tags: always
    user:
      name: void
      groups: root
  
  - name: add ssh key for void
    tags: always
    authorized_key:
      user: void
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINZV/VjSdJNEj5jcdZFz+fq6Nmticv2of6SgNNxlr+Xx ansible"

  - name: add sudoers file for void
    tags: always
    copy:
      src: sudoer_void
      dest: /etc/sudoers.d/void
      owner: root
      group: root
      mode: 0440

# CENTOS
# ADD REPO
  - name: add docker repo (centos)
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/centos/docker-ce.repo
      dest: /etc/yum.repos.d/docker-ce.repo
      mode: '0440'
    when: 
    - ansible_facts['distribution'] == "CentOS"  

# INSTALL DOCKER
  - name: install docker
    package:
      name: "{{ docker_packages }}"
      state: latest

# START DOCKER SERVICE
  - name: start docker service
    service:
      name: "{{ docker_service }}"
      state: started
      enabled: true

# INSTALL PYTHON REQUEST REQ 
  - name: install python requests 
    package:
      name: "{{ python_requests_package }}"
      state: present
    when: ansible_facts['distribution'] in ["Archlinux", "CentOS"]

