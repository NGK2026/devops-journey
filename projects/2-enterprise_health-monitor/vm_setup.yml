---
## ALL
# PKG UPDATES
- hosts: all
  become: true
  pre_tasks: # pre_task = run first

  - name: update cache (centos)
    tags: always # always run reguardless
    dnf:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "CentOS"

  - name: update cache (ubuntu)
    tags: always
    apt:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: update cache (archlinux)
    tags: always
    pacman:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Archlinux"

# VOID USER
- hosts: all
  become: true
  tasks:

  - name: create void user
    tags: always
    user:
      name: void
      groups: root
  
  - name: add ssh key for void
    tags: always
    authorized_key:
      user: void
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINZV/VjSdJNEj5jcdZFz+fq6Nmticv2of6SgNNxlr+Xx ansible"

  - name: add sudoers file for void
    tags: always
    copy:
      src: sudoer_void
      dest: /etc/sudoers.d/void
      owner: root
      group: root
      mode: 0440

# INSTALL DOCKER
# ARCH
  - name: install docker (arch)
    pacman:
      name:
        - docker
      state: latest
    when: 
      - ansible_facts['distribution'] == "Archlinux"
# UBUNTU 22
  - name: install docker (ubuntu 22)
    apt:
      name:
        - docker.io
      state: latest
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

# UBUNTU 26
  - name: install docker (ubuntu 26)
    apt:
      name:
        - docker.io
      state: latest
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "26"
# CENTOS
# ADD REPO
  - name: add docker repo (centos)
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/centos/docker-ce.repo
      dest: /etc/yum.repos.d/docker-ce.repo
      mode: '0440'
    when: 
    - ansible_facts['distribution'] == "CentOS"  
# INSTALL DOCKER
  - name: install docker from docker repo
    dnf:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
    when: 
      - ansible_facts['distribution'] == "CentOS"

# START DOCKER SERVICE
  - name: start docker service
    service:
      name: docker
      state: started
      enabled: true

# INSTALL PYTHON REQUEST REQ ARCH
  - name: install python requests (arch)
    community.general.pacman:
      name: python-requests
      state: present
    when: ansible_facts['distribution'] == "Archlinux"
# INSTALL PYTHON REQUEST REQ CENTOS
  - name: install python requests (centos)
    ansible.builtin.dnf:
      name: python3-requests
      state: present
    when: ansible_facts['distribution'] == "CentOS"

# START JENKINS CONTAINER
  - name: Start Jenkins container
    community.docker.docker_container:
      name: jenkins
      image: jenkins/jenkins
      state: started
      restart_policy: always
      network_mode: host
      volumes:
        - jenkins_home:/var/jenkins_home
        - /var/run/docker.sock:/var/run/docker.sock
        - /home/student/.minikube:/home/student/.minikube
      ports:
        - "8080:8080"
        - "50000:50000"