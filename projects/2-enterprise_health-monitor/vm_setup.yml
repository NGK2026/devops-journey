---
## ALL
# PKG UPDATES
- hosts: all
  become: true
  pre_tasks: # pre_task = run first

  - name: update cache (centos)
    tags: always # always run reguardless
    dnf:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "CentOS"

  - name: update cache (ubuntu)
    tags: always
    apt:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: update cache (archlinux)
    tags: always
    pacman:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Archlinux"

# VOID USER
- hosts: all
  become: true
  tasks:

  - name: create void user
    tags: always
    user:
      name: void
      groups: root
  
  - name: add ssh key for void
    tags: always
    authorized_key:
      user: void
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINZV/VjSdJNEj5jcdZFz+fq6Nmticv2of6SgNNxlr+Xx ansible"

  - name: add sudoers file for void
    tags: always
    copy:
      src: sudoer_void
      dest: /etc/sudoers.d/void
      owner: root
      group: root
      mode: 0440

# INSTALL DOCKER
# ARCH
  - name: install docker (arch)
    pacman:
      name:
        - docker
      state: latest
    when: 
      - ansible_facts['distribution'] == "Archlinux"
# UBUNTU 22
  # - name: install docker (ubuntu 22)
  #   apt:
  #     name:
  #       - docker
  #     state: latest
  #   when:
  #     - ansible_facts['distribution'] == "Ubuntu"
  #     - ansible_facts['distribution_major_version'] == "22"
  - name: add docker GPG (ubuntu 22)
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

  - name: add docker repo (ubuntu 22)
    ansible.builtin.apt_repository:
      repo: "deb [arch={{ ansible_dependency_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
      state: present
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

  - name: install docker (ubuntu 22)
    apt:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: latest
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

# UBUNTU 26
  - name: install docker (ubuntu 26)
    apt:
      name:
        - docker.io
      state: latest
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "26"
# CENTOS
# ADD REPO
  - name: add docker repo (centos)
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/centos/docker-ce.repo
      dest: /etc/yum.repos.d/docker-ce.repo
      mode: '0440'
    when: 
    - ansible_facts['distribution'] == "CentOS"  
# INSTALL DOCKER
  - name: install docker from docker repo
    dnf:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
    when: 
      - ansible_facts['distribution'] == "CentOS"

