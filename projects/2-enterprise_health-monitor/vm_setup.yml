# COPY BASH SCRIPT ONTO UBUNTU
  - name: copy bash script install kube on UBUNTU
    copy:
      src: kube-ubuntu-install.sh
      dest: /home/student/kube-ubuntu-install.sh
      mode: '0755'
    when: 
    - ansible_facts['distribution'] == "Ubuntu"  

# EXECUTE BASH
  - name: run kube install script (ubuntu)
    ansible.builtin.shell: /home/student/kube-ubuntu-install.sh
    become: true
    when: 
    - ansible_facts['distribution'] == "Ubuntu"

# COPY BASH SCRIPT ONTO CENTOS
  - name: copy bash script install kube on centos
    copy:
      src: kube-centos-install.sh
      dest: /home/student/kube-centos-install.sh
      mode: '0755'
    when: 
    - ansible_facts['distribution'] == "CentOS"  

# EXECUTE BASH
  - name: run kube install script (centos)
    shell: /home/student/kube-centos-install.sh
    become: true
    when: 
    - ansible_facts['distribution'] == "CentOS"

# INSTALL KUBE ON ARCH
  - name: install kubernetes (arch)
    pacman:
      name:
        - kubectl
        - kubeadm
        - kubelet
      state: latest
    when:
      - ansible_facts['distribution'] == "Archlinux"
      
# START kubelet SERVICE
  - name: start kubelet service (arch)
    service:
      name: kubelet
      state: started
      enabled: true

# KUBEADM INIT UBUNTU 22
  - name: init kubeadm (ubuntu)
    shell: kubeadm init --apiserver-advertise-address=192.168.0.124 --pod-network-cidr=10.244.0.0/16
    become: true
    args:
      creates: /etc/kubernetes/admin.conf # if present then its created
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

# COPY CNI SCRIPT UBUNTU 22
  - name: copy install cni plugin script (ubuntu 22)
    copy:
      src: cni-plugin-ubuntu.sh 
      dest: /home/student/cni-plugin-ubuntu.sh
      mode: '0755'
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

# RUN CNI SCRIPT UBUNTU 22
  - name: run cni plugin script (ubuntu 22)
    shell: |
      /home/student/cni-plugin-ubuntu.sh
      touch /etc/kubernetes/cni_installed
    become: true
    args:
      creates: /etc/kubernetes/cni_installed
    when:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_major_version'] == "22"

# CLEAR DISABLED PLUGIN
  - name: clear disabled plugin (centos)
    shell: |
      sed -i 's/^disabled_plugins =.*/disabled_plugins = []/g' /etc/containerd/config.toml
      systemctl restart containerd
      touch /etc/kubernetes/clear_disabled
    become: true
    args:
      creates: /etc/kubernetes/clear_disabled
    when:
      - ansible_facts['distribution'] == "CentOS"

# CONNECT CENTOS ARCH UBUNTU 26 TO HOST CLUSTER
  - name: connect others to host cluster
    shell: kubeadm join 192.168.0.124:6443 --token f1axir.ctg7hqkwo498p8kq --discovery-token-ca-cert-hash sha256:ba8f3acf40b10ca9601f873c28d1555dbb8575c0e838f5eec1a418721fbd7845 --ignore-preflight-errors=CRI,ContainerRuntimeVersion,Swap --fail-swap-on
    become: true
    args:
      creates: /etc/kubernetes/kubelet.conf
    when:
      - (ansible_facts['distribution'] == "CentOS") or 
        (ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_major_version'] == "26") or
        (ansible_facts['distribution'] == "Archlinux")