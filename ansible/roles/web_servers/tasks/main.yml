- name: install apache and php package
  tags: apache,apache2,ubuntu,php,v22
  package:
    name: 
      - "{{ apache_package_name }}"
      - "{{ php_package_name }}"
    state: latest
  
- name: start httpd (apache service)
  tags: apache,centos,httpd
  service:
    name: "{{ apache_service }}"
    state: started
    enabled: true

- name: enable firewalld service httpd
  tags: apache,centos,httpd
  ansible.posix.firewalld:
    service: http
    state: enabled
    permanent: true
    immediate: true
  when: ansible_facts['distribution'] in ["CentOS", "Archlinux"]

- name: edit line in file (change email addr for admin)
  tags: apache,centos,httpd
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^ServerAdmin'
    line: ServerAdmin someone@somewhere.net
  when: ansible_facts['distribution'] == "CentOS"
  notify: restart_httpd

- name: copy default html file for site
  tags: apache,apache2,httpd
  copy:
    src: default_site.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: 0644