---

- hosts: all
  become: true
  pre_tasks: # pre_task = run first

  - name: install updates (centos)
    dnf:
      update_only: true
      update_cache: true
    when: ansible_facts['distribution'] == "CentOS"

  - name: install updates (ubuntu)
    apt:
      upgrade: dist
      update_cache: true
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install updates (archlinux)
    pacman:
      upgrade: true
      update_cache: true
    when: ansible_facts['distribution'] == "Archlinux"

- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php package (ubuntu)
    apt:
      name: 
        - apache2
        - libapache2-mod-php
      state: latest
    when: 
      - ansible_facts['distribution'] == "Ubuntu"

  - name: install apache and php package (centos)
    dnf:
      name: 
        - httpd
        - php
      state: latest
    when: 
      - ansible_facts['distribution'] == "CentOS"

  - name: install apache and php package (archlinux)
    pacman:
      name: 
        - apache
        - php
      state: latest
    when: 
      - ansible_facts['distribution'] == "Archlinux"