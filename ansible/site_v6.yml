---
## ALL
- hosts: all
  become: true
  pre_tasks: # pre_task = run first

  - name: update cache (centos)
    tags: always # always run reguardless
    dnf:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "CentOS"

  - name: update cache (ubuntu)
    tags: always
    apt:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: update cache (archlinux)
    tags: always
    pacman:
      update_cache: true
    changed_when: false
    when: ansible_facts['distribution'] == "Archlinux"

- hosts: all
  become: true
  roles:
    - base

- hosts: workstations
  become: true
  roles:
    - workstations

- hosts: web_servers
  become: true
  roles:
    - web_servers

- hosts: db_servers
  become: true
  roles:
    - db_servers

- hosts: file_servers
  become: true
  roles:
    - db_servers
