---
## ALL
- hosts: all
  become: true
  pre_tasks: # pre_task = run first

  - name: install updates (centos)
    tags: always
    dnf:
      update_only: true
      update_cache: true
    when: ansible_facts['distribution'] == "CentOS"

  - name: install updates (ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: true
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install updates (archlinux)
    tags: always
    pacman:
      upgrade: true
      update_cache: true
    when: ansible_facts['distribution'] == "Archlinux"

## WEB_SERVERS
- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php package (ubuntu)
    tags: always
    apt:
      name: 
        - apache2
        - libapache2-mod-php
      state: latest
    when: 
      - ansible_facts['distribution'] == "Ubuntu"

  - name: install apache and php package (centos)
    tags: always
    dnf:
      name: 
        - httpd
        - php
      state: latest
    when: 
      - ansible_facts['distribution'] == "CentOS"

  - name: install apache and php package (archlinux)
    tags: always
    pacman:
      name: 
        - apache
        - php
      state: latest
    when: 
      - ansible_facts['distribution'] == "Archlinux"

## DB_SERVERS
- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (ubuntu)
    tags: always
    apt:
      name: mariadb-server
      state: latest
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install mariadb package (centos) # will not run
    tags: always
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_facts['distribution'] == "CentOS"

## FILE_SERVERS
- hosts: file_servers
  become: true
  tasks:
  
  # generic
  - name: install samba package
    tags: always
    package:
      name: samba
      state: latest