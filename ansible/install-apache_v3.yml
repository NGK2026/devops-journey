---

- hosts: all
  become: true
  tasks:

  - name: update repository index
    apt:
      update_cache: true
    when: # run only on ubuntu 22 and 26 # check gather_facts for variables/facts
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version in ["22", "26"] 

  - name: install apache2 package
    apt:
      name: apache2
      state: latest
    when: # run only on ubuntu 22 and 26
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version in ["22", "26"] 

  - name: add php support for apache
    apt:
      name: libapache2-mod-php
      state: latest
    when: # run only on ubuntu 22 and 26
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version in ["22", "26"] 