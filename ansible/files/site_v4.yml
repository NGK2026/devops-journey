---
## ALL
- hosts: all
  become: true
  pre_tasks: # pre_task = run first

  - name: install updates (centos)
    tags: always # always run reguardless
    dnf:
      update_only: true
      update_cache: true
    when: ansible_facts['distribution'] == "CentOS"

  - name: install updates (ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: true
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install updates (archlinux)
    tags: always
    pacman:
      upgrade: true
      update_cache: true
    when: ansible_facts['distribution'] == "Archlinux"

## USERS
- hosts: all
  become: true
  tasks:

  - name: create void user
    tags: always
    user:
      name: void
      groups: root
  
  - name: add ssh key for void
    tags: always
    authorized_key:
    user: void
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINZV/VjSdJNEj5jcdZFz+fq6Nmticv2of6SgNNxlr+Xx ansible"

  - name: add sudoers file for void
    tags: always
    copy:
      src: sudoer_void
      dest: /etc/sudoers.d/void
      owner: root
      group: root
      


## WORKSTATIONS
- hosts: workstations
  become: true
  tasks:

  - name: install unzip
    package:
      name: unzip

  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/1.15.3/terraform_1.15.3_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root

## WEB_SERVERS
- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php package (ubuntu)
    tags: apache,apache2,ubuntu,php,v22
    apt:
      name: 
        - apache2
        - libapache2-mod-php
      state: latest
    when: 
      - ansible_facts['distribution'] == "Ubuntu"

  - name: install apache and php package (centos)
    tags: apache,httpd,centos,php
    dnf:
      name: 
        - httpd
        - php
      state: latest
    when: 
      - ansible_facts['distribution'] == "CentOS"

  - name: start httpd (centos)
    tags: apache,centos,httpd
    service:
      name: httpd
      state: started
      enabled: true
    when: ansible_facts['distribution'] == "CentOS"

  - name: enable firewalld service httpd
    tags: apache,centos,httpd
    ansible.posix.firewalld:
      service: http
      state: enabled
      permanent: true
      immediate: true
    when: ansible_facts['distribution'] == "CentOS"

  - name: edit line in file (change email addr for admin)
    tags: apache,centos,httpd
    lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin someone@somewhere.net
    when: ansible_facts['distribution'] == "CentOS"
    register: httpd # remember
  
  - name: restart httpd (centos)
    tags: apache,centos,httpd
    service:
      name: httpd
      state: restarted
    when: httpd.changed # remember, did it change?

  - name: install apache and php package (archlinux)
    tags: apache,httpd,archlinux,php
    pacman:
      name: 
        - apache
        - php
      state: latest
    when: 
      - ansible_facts['distribution'] == "Archlinux"

  - name: copy default html file for site
    tags: apache,apache2,httpd
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644
      
## DB_SERVERS
- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (ubuntu)
    tags: mariadb,ubuntu,db,v26
    apt:
      name: mariadb-server
      state: latest
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install mariadb package (centos) # will not run
    tags: mariadb,db,centos
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_facts['distribution'] == "CentOS"

## FILE_SERVERS
- hosts: file_servers
  become: true
  tasks:
  
  # generic
  - name: install samba package
    tags: samba
    package:
      name: samba
      state: latest